<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Space Grotesk', sans-serif;
        }
        .neubrutalism {
            border: 3px solid #000;
            box-shadow: 5px 5px 0px #000;
            transition: all 0.2s ease;
        }
        .neubrutalism:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #000;
        }
        .message-container {
            height: calc(100vh - 180px);
        }
        .loading {
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-[#c7ecee] min-h-screen">
    <div class="container mx-auto p-4 max-w-4xl">
        <!-- Header -->
        <div class="neubrutalism bg-[#55efc4] p-6 mb-6 rounded">
            <h1 class="text-3xl font-bold">AI Chat Assistant</h1>
        </div>

        <!-- Chat Container -->
        <div class="neubrutalism bg-white rounded p-4 mb-4">
            <div id="messageContainer" class="message-container overflow-y-auto mb-4">
                <div class="bg-[#dfe6e9] p-4 rounded neubrutalism mb-4">
                    <p class="font-semibold">AI Assistant</p>
                    <p>Hello! How can I help you today?</p>
                </div>
            </div>

            <!-- Input Form -->
            <form id="chatForm" class="flex gap-2">
                <input type="text" id="userInput" class="neubrutalism flex-1 p-3 rounded" placeholder="Type your message...">
                <button type="submit" class="neubrutalism bg-[#55efc4] px-6 py-3 rounded font-bold">
                    Send
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const messageContainer = document.getElementById('messageContainer');

        let userId = localStorage.getItem('userId') || `user-${Date.now()}`;
        localStorage.setItem('userId', userId);

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `bg-[${isUser ? '#74b9ff' : '#dfe6e9'}] p-4 rounded neubrutalism mb-4`;
            messageDiv.innerHTML = `
                <p class="font-semibold">${isUser ? 'You' : 'AI Assistant'}</p>
                <p>${content}</p>
            `;
            messageContainer.appendChild(messageDiv);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function addLoadingIndicator() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.className = 'flex items-center gap-2 bg-[#dfe6e9] p-4 rounded neubrutalism mb-4';
            loadingDiv.innerHTML = `
                <div class="loading"></div>
                <p>Thinking...</p>
            `;
            messageContainer.appendChild(loadingDiv);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function removeLoadingIndicator() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            if (loadingIndicator) {
                loadingIndicator.remove();
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';
            addLoadingIndicator();

            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/ai', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer PHeoEwnNEKXsNVX45qUsqo91iXg1',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [{
                            role: 'user',
                            content: [{
                                type: 'text',
                                text: message
                            }]
                        }]
                    })
                });

                const data = await response.json();
                removeLoadingIndicator();
                addMessage(data.message);
            } catch (error) {
                removeLoadingIndicator();
                addMessage('Sorry, I encountered an error. Please try again.');
            }
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
